<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kanade Karaoke Dashboard</title>
  <style>
    :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
    body { max-width: 1100px; margin: 0 auto; padding: 2rem 1rem; line-height: 1.5; }
    table { width: 100%; border-collapse: collapse; margin: 1rem 0 2rem; }
    th, td { border-bottom: 1px solid #8885; padding: .55rem; text-align: left; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 1rem; }
    .card { border: 1px solid #8885; border-radius: .6rem; padding: 1rem; }
    .muted { opacity: .75; }
    a { color: #6ea8fe; }
  </style>
</head>
<body>
  <main>
    <h1>Kanade Karaoke Dashboard</h1>
    <p class="muted">정규화된 set list 데이터에서 자동 계산되는 통계입니다.</p>

    <section class="grid" aria-label="summary">
      <div class="card"><strong id="broadcast-count">0</strong><br>방송 수</div>
      <div class="card"><strong id="performance-count">0</strong><br>공연 수</div>
      <div class="card"><strong id="unique-song-count">0</strong><br>고유 음원 수</div>
      <div class="card"><strong id="year-count">0</strong><br>연도 수</div>
    </section>

    <h2>연도별 음원</h2>
    <div id="yearly-songs"><p class="muted">데이터를 불러오는 중입니다.</p></div>

    <h2>사용 횟수 상위 50곡</h2>
    <div id="top-songs"><p class="muted">데이터를 불러오는 중입니다.</p></div>

    <h2>분위기·종류</h2>
    <p class="muted">분위기와 장르는 검토된 메타데이터가 있을 때만 표시합니다. 사용 횟수만으로 분위기나 장르를 추정하지 않습니다.</p>
    <div id="tags"><p class="muted">검토된 태그 데이터가 없습니다.</p></div>
  </main>

  <script>
    const dataUrl = './data/karaoke/normalized/performances.json';

    function escapeHtml(value) {
      return String(value ?? '').replace(/[&<>"']/g, char => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[char]));
    }

    function renderTable(headers, rows) {
      if (!rows.length) return '<p class="muted">표시할 데이터가 없습니다.</p>';
      return '<table><thead><tr>' + headers.map(h => '<th>' + escapeHtml(h) + '</th>').join('') +
        '</tr></thead><tbody>' +
        rows.map(row => '<tr>' + row.map(cell => '<td>' + escapeHtml(cell) + '</td>').join('') + '</tr>').join('') +
        '</tbody></table>';
    }

    function getYear(item) {
      return String(item.date || item.broadcastDate || '').slice(0, 4) || '미상';
    }

    fetch(dataUrl, { cache: 'no-store' })
      .then(response => response.ok ? response.json() : Promise.reject(new Error('data unavailable')))
      .then(payload => {
        const performances = payload.performances || [];
        const broadcasts = new Set(performances.map(item => item.broadcastId).filter(Boolean));
        const songs = new Map();
        const years = new Map();

        performances.forEach(item => {
          const key = item.normalizedTitle || item.title || '미상';
          const entry = songs.get(key) || { title: item.title || key, artist: item.artist || '', count: 0 };
          entry.count += 1;
          songs.set(key, entry);

          const year = getYear(item);
          const yearMap = years.get(year) || new Map();
          yearMap.set(key, (yearMap.get(key) || 0) + 1);
          years.set(year, yearMap);
        });

        document.querySelector('#broadcast-count').textContent = broadcasts.size;
        document.querySelector('#performance-count').textContent = performances.length;
        document.querySelector('#unique-song-count').textContent = songs.size;
        document.querySelector('#year-count').textContent = years.size;

        const top = [...songs.values()].sort((a, b) => b.count - a.count || a.title.localeCompare(b.title)).slice(0, 50);
        document.querySelector('#top-songs').innerHTML = renderTable(
          ['곡', '가수', '사용 횟수'],
          top.map(item => [item.title, item.artist, item.count])
        );

        const yearlyRows = [];
        [...years.keys()].sort().reverse().forEach(year => {
          const entries = [...years.get(year).entries()]
            .sort((a, b) => b[1] - a[1])
            .map(([key, count]) => songs.get(key).title + ' (' + count + ')')
            .join(', ');
          yearlyRows.push([year, entries]);
        });
        document.querySelector('#yearly-songs').innerHTML = renderTable(['연도', '음원 목록 (사용 횟수)'], yearlyRows);
      })
      .catch(() => {
        document.querySelector('#yearly-songs').innerHTML = '<p class="muted">정규화된 데이터가 아직 없습니다.</p>';
        document.querySelector('#top-songs').innerHTML = '<p class="muted">정규화된 데이터가 아직 없습니다.</p>';
      });
  </script>
</body>
</html>
