name: Validate karaoke data

on:
  push:
    paths:
      - "data/**"
      - "scripts/**"
      - ".github/workflows/validate.yml"
  pull_request:
    paths:
      - "data/**"
      - "scripts/**"
      - ".github/workflows/validate.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Validate karaoke data
        run: python scripts/validate_karaoke.py
