name: Validate karaoke data

on:
  push:
    paths:
      - "data/**"
      - "scripts/**"
      - ".github/workflows/validate.yml"
  pull_request:
    paths:
      - "data/**"
      - "scripts/**"
      - ".github/workflows/validate.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Validate karaoke data
        run: python scripts/validate_karaoke.py
      - name: Test Korean feature profiles
        run: python -B -m unittest discover -s scripts/karaoke -p test_tag_profile.py
      - name: Verify reproducible dashboard artifacts
        run: |
          python -B scripts/karaoke/build_song_features.py
          python -B scripts/karaoke/build_dashboard.py
          git diff --exit-code -- site/data.json data/karaoke/normalized/song-features.ko.json
