name: Process local Setlist Index snapshot

on:
  workflow_dispatch:
  push:
    paths:
      - "data/karaoke/raw/setlist-index/**"
      - "scripts/karaoke/**"
      - ".github/workflows/import-setlist-index.yml"

permissions:
  contents: read

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Check local snapshot
        run: test -f data/karaoke/raw/setlist-index/latest.html
      - name: Parse local Setlist Index snapshot
        run: python scripts/karaoke/import_setlist_index.py --input data/karaoke/raw/setlist-index/latest.html
      - name: Normalize imported candidates
        run: python scripts/karaoke/normalize_setlist_index.py
      - name: Build statistics and playlist manifests
        run: python scripts/karaoke/build_stats.py
      - name: Upload processed artifact
        uses: actions/upload-artifact@v4
        with:
          name: setlist-index-import
          path: |
            data/karaoke/raw/setlist-index/
            data/karaoke/candidates/
            data/karaoke/normalized/
            data/karaoke/playlist/
