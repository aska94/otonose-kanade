name: Build karaoke artifacts

on:
  workflow_dispatch:
  push:
    paths:
      - "data/karaoke/candidates/**"
      - "data/karaoke/normalized/**"
      - "data/karaoke/source-metadata/**"
      - "scripts/karaoke/**"
      - ".github/workflows/import-setlist-index.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Validate committed data
        run: python scripts/validate_karaoke.py
      - name: Build aggregate data
        run: python scripts/karaoke/build_site_data.py --input-dir data/karaoke/normalized/broadcasts --output-dir data/karaoke/build
      - name: Build statistics and playlist manifests
        run: python scripts/karaoke/build_stats.py --input data/karaoke/build/performances.json
      - name: Upload generated artifacts
        uses: actions/upload-artifact@v4
        with:
          name: karaoke-artifacts
          path: |
            data/karaoke/source-metadata/
            data/karaoke/normalized/
            data/karaoke/playlist/
